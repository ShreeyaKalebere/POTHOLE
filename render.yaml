services:
  - type: web
    name: road-damage-kolhapur
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: DB_NAME
        value: pothole_detection
      - key: INFER_DEVICE
        value: cpu
      - key: MEDIA_BACKEND
        value: gridfs
      - key: PORT
        value: 8000

