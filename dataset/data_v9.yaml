# v9: everything usable for training - train + val (no test leakage) + reviewed Kolhapur frames.
# Rationale (from the audit, qa/audit_summary.md): v8 dropped tiny boxes, Norway/Czech and half of
# Japan, and scored WORSE than v1 (0.600 vs 0.639) - those images are exactly what the test set is
# made of. v9 keeps every image and every box.
path: dataset
train:
  - images/train
  - images/val
  - images/train_kol_v7
val: images/val
test: images/test

nc: 2
names: ['pothole', 'alligator_crack']
